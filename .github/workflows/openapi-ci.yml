name: OpenAPI - CI

on:
  pull_request:
    paths:
      - 'openapi.yaml'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli @stoplight/spectral-rulesets

      - name: Lint OpenAPI spec
        run: spectral lint openapi.yaml --ruleset npm:@stoplight/spectral-rulesets/dist/oas/index.js
