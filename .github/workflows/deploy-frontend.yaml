name: Deploy Frontend

on:
  workflow_call:
    inputs:
      runner:
        description: Runner to use
        default: ubuntu-latest
        required: false
        type: string
      region:
        description: AWS region
        required: true
        type: string
      role-to-assume:
        description: AWS role to assume
        required: true
        type: string
      role-session-name:
        description: AWS role session name
        required: false
        type: string
        default: wordly_github_actions
      deploy-env:
        description: Deployment environment
        required: false
        type: string
        default: "Development"

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    name: S3 and CF
    environment:
      name: ${{ inputs.deploy-env }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          role-session-name: ${{ inputs.role-session-name }}
          aws-region: ${{ inputs.region }}
          mask-aws-account-id: 'true'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE_API_URL: ${{ vars.VITE_BASE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_OAUTH_REDIRECT_URI: ${{ vars.VITE_OAUTH_REDIRECT_URI }}
          VITE_BUILD_VERSION: ${{ github.sha }}
        run: |
          npm ci
          npm run build
          echo "{\"version\": \"${{ github.sha }}\"}" > dist/version.json

      - name: Upload to S3 (hashed assets)
        run: |
          aws s3 sync ./frontend/dist s3://${{ vars.S3_BUCKET_FRONTEND }} \
            --delete \
            --exclude "index.html" \
            --exclude "version.json" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload to S3 (index.html & version.json)
        run: |
          aws s3 sync ./frontend/dist s3://${{ vars.S3_BUCKET_FRONTEND }} \
            --exclude "*" \
            --include "index.html" \
            --include "version.json" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DIST_ID }} \
            --paths "/index.html" "/version.json"