spring:
  application:
    name: wordly-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wordly}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:yourpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

admin:
  email: ${ADMIN_EMAIL:admin@wordly.local}
  password: ${ADMIN_PASSWORD:admin12345}
  name: ${ADMIN_NAME:Admin}
  surname: ${ADMIN_SURNAME:User}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}

openrouter:
  api-key: ${OPENROUTER_API_KEY}
  model: ${OPENROUTER_MODEL}
  base-url: ${OPENROUTER_BASE_URL}

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  pattern:
    console: "%d{MM/dd/yyyy HH:mm:ss} %highlight(%-5level) [%logger{35}] %msg%n"
  level:
    root: WARN
    com.wordly: DEBUG
    org.flywaydb: INFO
    org.springframework.boot.web.embedded: INFO