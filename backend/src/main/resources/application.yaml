spring:
  application:
    name: wordly-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wordly}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:yourpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    com.wordly: DEBUG
    org.springframework.security: INFO